<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Maka Clothing — Gestión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ---------- LOGIN ---------- -->
  <div id="login-screen">
    <div id="login-box">
      <div class="login-logo">
        <img src="assets/logo-mark.png" alt="" />
        <h1>Maka</h1>
      </div>
      <p class="sub">Gestión administrativa · Clothing</p>
      <input id="login-email" type="email" placeholder="Correo" />
      <input id="login-password" type="password" placeholder="Contraseña" />
      <button id="login-btn">Entrar</button>
      <div id="login-error"></div>
    </div>
  </div>

  <!-- ---------- APP ---------- -->
  <div id="app-screen">
    <div id="sidebar">
      <div class="brand">
        <div class="brand-mark"><img src="assets/logo-mark.png" alt="" /></div>
        <div class="brand-name">
          <div>
            <div style="display:flex;align-items:center;gap:8px;">Maka <span class="tag">ERP</span></div>
            <span class="brand-sub"><b>Clothing</b> · <span id="user-role-label"></span></span>
          </div>
        </div>
      </div>

      <div class="nav-item nav-top" data-view="resumen">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Resumen
      </div>

      <div class="nav-group open">
        <div class="nav-group-title">
          <svg class="icon sm" viewBox="0 0 24 24"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 8.7 5 8.7-5"/></svg>
          Inventario
        </div>
        <div class="nav-item" data-view="productos">Productos <span class="nav-badge" data-badge="productos"></span></div>
        <div class="nav-item" data-view="materiaPrima">Materia prima <span class="nav-badge" data-badge="materiaPrima"></span></div>
        <div class="nav-item" data-view="produccion">Producción</div>
        <div class="nav-item" data-view="equipos">Equipos <span class="nav-badge" data-badge="equipos"></span></div>
        <div class="nav-item" data-view="disenos">Diseños</div>
      </div>

      <div class="nav-group open">
        <div class="nav-group-title">
          <svg class="icon sm" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          Compra y venta
        </div>
        <div class="nav-item" data-view="pedidos">Pedidos <span class="nav-badge hot" data-badge="pedidos"></span></div>
        <div class="nav-item" data-view="presupuestos">Presupuestos</div>
        <div class="nav-item" data-view="ventas">Ventas</div>
        <div class="nav-item" data-view="clientes">Clientes</div>
        <div class="nav-item" data-view="compras" data-admin-only="1">Compras</div>
      </div>

      <div class="nav-group open">
        <div class="nav-group-title">
          <svg class="icon sm" viewBox="0 0 24 24"><path d="M4 21v-7"/><path d="M4 10V3"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M20 21v-5"/><path d="M20 12V3"/><path d="M1 14h6"/><path d="M9 8h6"/><path d="M17 16h6"/></svg>
          Configuración
        </div>
        <div class="nav-item" data-view="config" data-admin-only="1">Configuración</div>
      </div>

      <div class="bottom">
        <div class="user-card">
          <div class="avatar" id="user-avatar">MK</div>
          <div class="user-info">
            <div id="user-email-label"></div>
            <div class="sesion">Sesión activa</div>
          </div>
        </div>
        <button id="logout-btn">
          <svg class="icon sm" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
          Cerrar sesión
        </button>
      </div>
    </div>

    <div id="main">
      <div id="topbar">
        <div class="title-wrap">
          <h1 id="topbar-title">Resumen</h1>
          <span class="chip" id="topbar-chip">Panel de control</span>
        </div>
        <div class="actions">
          <label class="search-box">
            <svg class="icon sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="global-search" placeholder="Filtrar esta lista (ej. FE01, Berserk)..." autocomplete="off" />
            <kbd>/</kbd>
          </label>
          <button class="btn btn-outline" id="quick-venta">
            <svg class="icon sm" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            Registrar venta
          </button>
          <button class="btn btn-primary" id="quick-pedido">
            <svg class="icon sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>
            Nuevo pedido
          </button>
        </div>
      </div>
      <div id="content"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
