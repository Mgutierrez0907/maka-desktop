<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Maka Clothing — Gestión</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Pantalla de login -->
  <div id="login-screen" class="screen">
    <div class="login-card">
      <img src="assets/logo.png" class="login-logo" alt="Maka Clothing" onerror="this.style.display='none'" />
      <h1>Maka Clothing</h1>
      <p class="muted">Gestión administrativa</p>
      <form id="login-form">
        <label>Correo
          <input type="email" id="login-email" required autocomplete="username" />
        </label>
        <label>Contraseña
          <input type="password" id="login-password" required autocomplete="current-password" />
        </label>
        <button type="submit" id="login-btn">Entrar</button>
        <p id="login-error" class="error-text"></p>
      </form>
    </div>
  </div>

  <!-- App principal -->
  <div id="app-screen" class="screen hidden">
    <aside class="sidebar">
      <div class="brand">
        <img src="assets/logo.png" class="brand-logo" alt="" onerror="this.style.display='none'" />
        <span>Maka Clothing</span>
      </div>
      <nav id="nav-menu"></nav>
      <div class="sidebar-footer">
        <div id="user-chip" class="user-chip"></div>
        <button id="logout-btn" class="link-btn">Cerrar sesión</button>
      </div>
    </aside>
    <main class="content">
      <div id="view-root"></div>
    </main>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
